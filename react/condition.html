<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number</title>
</head>
<body>
    <script>
        let num = 153;
        let sum = 0;
        let temp = num;
        
        while (temp > 0) {
            let digit = temp % 10;
            sum += digit * digit * digit;
            temp = Math.floor(temp / 10);
        }
        
        if (sum === num) {
            document.writeln(num + " is an Armstrong number.");
        } else {
            document.writeln(num + " is not an Armstrong number.");
        }
    </script>
</body>
</html>
