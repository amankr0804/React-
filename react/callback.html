<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function logResult(callback) {
            const result = 2 + 2;
            callback(result);
        }

        logResult(function(result) {
            console.log(result);
        });
    </script>
</body>
</html>
