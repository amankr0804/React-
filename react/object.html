<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        const student = {
            name: "John Doe",
            age: 20,
            major: "Computer Science",}
           for(let x in student){
            document.write(student[x] + "<br>");
           }
        
    </script>
</body>
</html>
