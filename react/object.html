<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        const student = {
            name: "John Doe",
            age: 20,
            major: "Computer Science",}
           document.writeln("<br>Name: " + student.name);
            document.writeln("<br>Age: " + student.age);
            document.writeln("<br>Major: " + student.major);

        
    </script>
</body>
</html>
